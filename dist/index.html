<canvas id="exa" width="600" height="600"></canvas>
<script>
const canvas = document.getElementById('exa');
const ctx = canvas.getContext('2d');

let width = canvas.width;
let height = canvas.height;

let centerX, centerY;
const radius = 250;

function updateCenter() {
  const rect = canvas.getBoundingClientRect();
  centerX = rect.width / 2;
  centerY = rect.height / 2;
}

window.addEventListener('resize', updateCenter);
updateCenter();

let time = 0;

//  Función para dibujar un hexágono animado
function drawHexagon(cx, cy, r, rotation = 0) {
  ctx.beginPath();
  for (let i = 0; i <= 6; i++) {
    const angle = (Math.PI / 3) * i + rotation; // 360° / 6 lados
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawexa(t) {
  ctx.clearRect(0, 0, width, height);
  updateCenter();

   const colors = ['#FFA500', '#FF4500', '#FFFF00']; 

  colors.forEach((color, i) => {
    let waveRadius = radius + 10 * Math.sin(t + i * 2);
    let offsetX = 5 * Math.sin(t * 2 + i * 5);
    let offsetY = 5 * Math.cos(t * 2 + i * 5);

    ctx.strokeStyle = color;
    ctx.lineWidth = 6;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;

    // Dibuja hexágono en lugar de círculo
    drawHexagon(centerX + offsetX, centerY + offsetY, waveRadius, t * 0.1 + i);
    ctx.stroke();
  });

  // Puntos girando alrededor (sin cambios)
  for (let i = 0; i < 20; i++) {
    let angle = (Math.PI * 2 / 20) * i + t * 0.5;
    let x = centerX + (radius - 40) * Math.cos(angle);
    let y = centerY + (radius - 40) * Math.sin(angle);

    ctx.beginPath();
    ctx.fillStyle = `rgba(0, 191, 255, 0.6)`;
    ctx.shadowColor = 'rgba(0, 191, 255, 0.9)';
    ctx.shadowBlur = 10;
    ctx.arc(x, y, 5 + 3 * Math.sin(t + i), 0, Math.PI * 2);
    ctx.fill();
  }
}

function animate(timeStamp) {
  time += 0.02;
  drawexa(time);
  requestAnimationFrame(animate);
}

animate();
</script>
