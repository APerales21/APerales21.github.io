<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fundadores</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1 style="color: var(--salmon);">Fundadores</h1>
      <p style="color: var(--Amarillo-pastel); margin-top: 10px;">Conoce a el alma de Tapir Industries.</p>
    </div>
  </header>
  <main>
    <section class="services">
      <div class="card" style="background: var(--contraste); border: 1px solid var(--salmon); color: var(--blanco-palido); max-width: 820px; margin: 0 auto; padding: 32px; border-radius: 24px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);">
        <div class="icon" style="background-color: var(--salmon); width: 70px; height: 70px; border-radius: 18px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;">
          <span style="color: var(--contraste); font-weight: 700; font-size: 1.2rem;">TI</span>
        </div>
        <h3 style="color: var(--Amarillo-pastel);">Tapir Industries</h3>
        <p style="color: var(--blanco-palido); opacity: 0.95; margin-bottom: 18px;">Bienvenido a la página de los fundadores. Aquí encontrarás la visión, valores y compromiso del equipo que da vida a cada servicio.</p>
        <p style="color: var(--durazno); font-weight: 700;">"Soluciones a tu medida y más cerca de T.I."</p>
      </div>
      <div class="photo-gallery">
        <div class="photo-row">
          <figure class="photo-card">
            <img src="../img/tp1.jpeg" alt="Ing. Pablo Lomelí">
            <figcaption class="photo-label">Ing. Pablo Lomelí</figcaption>
          </figure>
          <figure class="photo-card">
            <img src="../img/tp2.jpeg" alt="Ing. Alexis Perales">
            <figcaption class="photo-label">Ing. Alexis Perales</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>
  <footer style="background: transparent; border-top: none;">
    <p style="color: var(--Amarillo-pastel);">&copy; 2026 Tapir Industries</p>
  </footer>
</body>
</html>
